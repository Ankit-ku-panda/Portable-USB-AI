<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212121">

    <title>Portable AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app" class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <div style="display:flex; align-items:center; gap:10px;">
                <button
                    id="newChatBtn"
                    class="new-chat-btn"
                    type="button"
                    style="flex:1;"
                >
                    <span class="plus">＋</span>
                    <span>New chat</span>
                </button>

                <button
                    id="closeSidebarBtn"
                    class="sidebar-close"
                    type="button"
                    aria-label="Close sidebar"
                    title="Close sidebar"
                >
                    ×
                </button>
            </div>

        </div>

        <div id="chatHistory" class="chat-history">

            <div class="history-label">
                Your chats
            </div>

            <div id="historyList"></div>

        </div>

        <div class="sidebar-footer">

            <button
                id="settingsBtn"
                class="sidebar-button"
                type="button"
            >
                <span>⚙</span>
                <span>Settings</span>
            </button>

            <div class="sidebar-brand">

                <div class="brand-icon">
                    P
                </div>

                <div>

                    <div class="brand-name">
                        Portable AI
                    </div>

                    <div class="brand-status">
                        Local & Offline
                    </div>

                </div>

            </div>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main id="chatScreen" class="main-content">

        <!-- TOP BAR -->

        <header class="topbar">

            <div class="topbar-left">

                <button
                    id="menuBtn"
                    class="icon-button mobile-menu"
                    type="button"
                >
                    ☰
                </button>

                <div class="model-title">

                    <div
                        id="modelInfo"
                        class="model-name"
                    >
                        Loading model...
                    </div>

                    <div
                        id="status"
                        class="model-status"
                    >
                        ● Connecting
                    </div>

                </div>

            </div>

            <div class="topbar-right">

                <button
                    id="modelButton"
                    class="model-button"
                    type="button"
                >
                    <span>Model</span>
                    <span>⌄</span>
                </button>

            </div>

        </header>


        <!-- ================= CHAT ================= -->

        <section
            id="chat"
            class="chat-container"
        >

            <div
                id="welcomeScreen"
                class="welcome-screen"
            >

                <div class="welcome-icon">
                    P
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask Portable AI anything.
                </p>

                <div class="suggestion-grid">

                    <button
                        class="suggestion-card"
                        data-prompt="Explain this code to me step by step."
                        type="button"
                    >
                        <strong>
                            💻 Explain code
                        </strong>

                        <span>
                            Understand code step by step
                        </span>
                    </button>


                    <button
                        class="suggestion-card"
                        data-prompt="Help me debug this code and find the problem."
                        type="button"
                    >
                        <strong>
                            🐛 Debug code
                        </strong>

                        <span>
                            Find and fix programming problems
                        </span>
                    </button>


                    <button
                        class="suggestion-card"
                        data-prompt="Give me a clean runnable Python programming example."
                        type="button"
                    >
                        <strong>
                            🐍 Write Python
                        </strong>

                        <span>
                            Create clean runnable Python code
                        </span>
                    </button>


                    <button
                        class="suggestion-card"
                        data-prompt="Explain a difficult concept in a simple way."
                        type="button"
                    >
                        <strong>
                            🧠 Learn something
                        </strong>

                        <span>
                            Get a simple explanation
                        </span>
                    </button>

                </div>

            </div>

        </section>


        <!-- ================= INPUT ================= -->

        <div class="input-wrapper">

            <div class="input-box">

                <button
                    id="attachButton"
                    class="input-icon"
                    type="button"
                    title="Attach"
                >
                    ＋
                </button>

                <textarea
                    id="messageInput"
                    rows="1"
                    autocomplete="off"
                    spellcheck="true"
                    placeholder="Message Portable AI..."
                ></textarea>

                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    title="Send"
                >
                    ↑
                </button>

            </div>

            <div class="input-disclaimer">
                Portable AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<!-- ================= SETUP SCREEN ================= -->

<div
    id="setupScreen"
    class="setup-screen"
    style="display:none;"
>

    <div class="setup-overlay"></div>

    <div class="setup-card">

        <div class="setup-header">

            <div class="setup-logo">
                P
            </div>

            <div>

                <h2>
                    Portable AI
                </h2>

                <p id="setupSubtitle">
                    Choose your local GGUF model
                </p>

            </div>

        </div>

        <div class="form-group">
            <label for="providerSelect">
                Provider
            </label>

            <select id="providerSelect">
                <option value="local">Local GGUF model</option>
                <option value="openai">OpenAI</option>
                <option value="gemini">Google Gemini</option>
                <option value="deepseek">DeepSeek</option>
                <option value="openrouter">OpenRouter</option>
                <option value="custom">Custom OpenAI-compatible</option>
            </select>
        </div>

        <div class="form-group model-local-group">

            <label for="modelSelect">
                Local model
            </label>

            <select id="modelSelect">
                <option value="">
                    Loading models...
                </option>
            </select>

            <small>
                Models are loaded from the
                <code>models/</code> folder.
            </small>

        </div>

        <div class="form-group model-remote-group" style="display:none;">
            <label for="modelNameInput">
                Model name
            </label>

            <input
                id="modelNameInput"
                class="text-input"
                type="text"
                placeholder="gpt-4o-mini"
            >
        </div>

        <div class="form-group">
            <label for="apiKeyInput">
                API key
            </label>

            <input
                id="apiKeyInput"
                class="text-input"
                type="password"
                placeholder="Enter API key"
            >
        </div>

        <div class="form-group">
            <label for="baseUrlInput">
                Base URL
            </label>

            <input
                id="baseUrlInput"
                class="text-input"
                type="text"
                placeholder="https://api.openai.com/v1"
            >
        </div>


        <button
            id="saveConfigBtn"
            class="btn-primary"
            type="button"
        >
            Start chatting
        </button>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
